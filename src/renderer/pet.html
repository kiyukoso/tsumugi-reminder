<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<!-- 立绘是以 blob URL 交给 <img> 的，img-src 必须放行 blob: -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' blob:" />
<title>桌宠</title>
<style>
  /* 这个窗口自己是透明的，尺寸由主进程按立绘宽高比定，所以风格不共用 theme.css */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    cursor: default;
    user-select: none;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    /* 头顶留出的空档，给提醒气泡用。数值需与 main.js 的 PET_BUBBLE_H 一致 */
    --bubble-h: 92px;
  }

  #pet {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    height: calc(100% - var(--bubble-h));
    width: auto;
    -webkit-user-drag: none;
    pointer-events: none;          /* 点击一律由 body 的命中检测决定，见 pet.js */
    filter: drop-shadow(0 6px 14px rgba(60, 80, 130, 0.28));
    transition: filter 0.25s ease;
    animation: breathe 5.5s ease-in-out infinite;
  }

  /* 只有极其轻微的呼吸感：不做位移，避免影响逐像素命中判定 */
  @keyframes breathe {
    0%, 100% { filter: drop-shadow(0 6px 14px rgba(60, 80, 130, 0.28)) brightness(1); }
    50%      { filter: drop-shadow(0 6px 16px rgba(60, 80, 130, 0.34)) brightness(1.035); }
  }

  /* 这里原本想给「鼠标压住桌宠」加一层蓝色高亮，但那条规则从来没生效过：
     CSS 里 @keyframes 动画的优先级高于普通声明，breathe 动画一直在写 filter，
     把 body.over 的 filter 整个盖掉了。要让两者共存得把动画挪到外层包一层，
     代价是命中检测和布局都要跟着改 —— 收益不值这个风险，所以直接删掉，
     免得留一条看着有用、实际不生效的规则误导以后改代码的人。 */

  /* ---------------------------------------------------------- 提醒气泡 */

  #bubble {
    position: absolute;
    top: 2px;
    left: 50%;
    transform: translateX(-50%) translateY(-8px) scale(0.94);
    max-width: 260px;
    min-width: 130px;
    padding: 9px 14px;
    border-radius: 13px;
    background: linear-gradient(180deg, #ffffff, #f5f8ff);
    border: 1px solid rgba(86, 128, 228, 0.35);
    box-shadow: 0 8px 24px rgba(70, 92, 145, 0.28);
    color: #3a4256;
    font-size: 13px;
    line-height: 1.5;
    text-align: center;
    word-break: break-word;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.28s ease, transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
  }

  #bubble.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
  }

  /* 气泡下方的小尖角，指向角色 */
  #bubble::after {
    content: "";
    position: absolute;
    bottom: -6px;
    left: 50%;
    margin-left: -6px;
    width: 11px;
    height: 11px;
    background: #f5f8ff;
    border-right: 1px solid rgba(86, 128, 228, 0.35);
    border-bottom: 1px solid rgba(86, 128, 228, 0.35);
    transform: rotate(45deg);
    border-radius: 0 0 3px 0;
  }

  #bubble .ico {
    display: block;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: #5680e4;
    margin-bottom: 3px;
  }
</style>
</head>
<body>
  <!-- src 由 pet.js 从主进程取（可能是自定义立绘），不写死 -->
  <img id="pet" alt="" />
  <div id="bubble"><span class="ico">提醒</span><span id="bubbleText"></span></div>
  <script src="js/pet.js"></script>
</body>
</html>
