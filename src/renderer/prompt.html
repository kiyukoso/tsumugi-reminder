<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
<title>编辑</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    color: #3a4256;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }

  /* 无边框透明窗口里画一张卡片，四角圆角和阴影都由 CSS 负责 */
  .card {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 13px;
    padding: 20px 22px;
    border-radius: 16px;
    background: linear-gradient(180deg, #ffffff, #f6f9ff);
    border: 1px solid rgba(86, 128, 228, 0.20);
    box-shadow: 0 16px 40px rgba(70, 92, 145, 0.26);
    -webkit-app-region: drag;      /* 整张卡片都能拖着走 */
  }

  .title {
    font-size: 12.5px;
    letter-spacing: 0.18em;
    color: #8a93a8;
    flex: none;
  }

  .body {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
    justify-content: center;
    -webkit-app-region: no-drag;
  }

  input, select {
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    color: #3a4256;
    background: rgba(255, 255, 255, 0.75);
    border: 1px solid rgba(86, 128, 228, 0.24);
    border-radius: 9px;
    padding: 9px 12px;
    outline: none;
    transition: border-color 0.16s, box-shadow 0.16s;
  }

  input:focus, select:focus {
    border-color: rgba(86, 128, 228, 0.78);
    box-shadow: 0 0 0 3px rgba(86, 128, 228, 0.12);
  }

  .row { display: flex; gap: 9px; align-items: center; }
  .row input { flex: 1; }
  .row select { width: 96px; flex: none; }

  .hint {
    font-size: 12px;
    color: #b9c0cf;
    line-height: 1.5;
  }

  .actions {
    display: flex;
    gap: 9px;
    justify-content: flex-end;
    flex: none;
    -webkit-app-region: no-drag;
  }

  button {
    font-family: inherit;
    font-size: 13.5px;
    padding: 8px 20px;
    border-radius: 9px;
    cursor: pointer;
    border: 1px solid rgba(86, 128, 228, 0.42);
    background: transparent;
    color: #3f66c9;
    transition: background 0.16s, border-color 0.16s;
  }

  button:hover { background: rgba(86, 128, 228, 0.14); border-color: rgba(86, 128, 228, 0.78); }

  button.primary {
    background: rgba(86, 128, 228, 0.14);
    border-color: rgba(86, 128, 228, 0.78);
    font-weight: 600;
  }

  button.primary:hover { background: rgba(86, 128, 228, 0.26); }

  button.ghost { border-color: transparent; color: #8a93a8; }
  button.ghost:hover { border-color: rgba(86, 128, 228, 0.42); color: #3f66c9; }
</style>
</head>
<body>
  <div class="card">
    <div class="title" id="title">编辑</div>
    <div class="body" id="body"></div>
    <div class="actions">
      <button class="ghost" id="cancel">取消</button>
      <button class="primary" id="ok">确定</button>
    </div>
  </div>
  <script src="js/prompt.js"></script>
</body>
</html>
